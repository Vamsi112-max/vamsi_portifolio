<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found · Vamsi Raju</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .notfound-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 40px 24px; }
  .notfound-card{ max-width: 560px; text-align:center; }
  .notfound-card .terminal{ justify-content:center; display:flex; flex-direction:column; align-items:center; }
  .notfound-code{ font-family: var(--font-display); font-size: clamp(64px, 14vw, 120px); font-weight:700; color: var(--accent); line-height:1; margin: 18px 0; }
  .notfound-actions{ margin-top: 30px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="notfound-shell">
  <div class="notfound-card">
    <div class="terminal">
      <div class="ln"><span class="prompt">$</span><span>cd /requested-page</span></div>
      <div class="ln"><span class="out">&gt;</span><span>bash: no such file or directory</span></div>
    </div>
    <div class="notfound-code">404</div>
    <h1 style="font-size: clamp(20px,3vw,26px); margin-bottom: 10px;">This route doesn't exist — yet.</h1>
    <p class="lede" style="max-width:none;">The page you're looking for was moved, renamed, or never built. Let's get you back on track.</p>
    <div class="notfound-actions">
      <a class="btn btn-primary" href="index.html">Back to home →</a>
      <a class="btn btn-ghost" href="index.html#projects">See projects</a>
    </div>
  </div>
</div>
</body>
</html>
